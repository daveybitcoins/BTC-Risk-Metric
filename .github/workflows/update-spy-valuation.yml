name: Update SPY forward valuation

on:
  schedule:
    - cron: '0 14 * * 1' # Monday morning, after FactSet's Friday report
  workflow_dispatch:

concurrency:
  group: spy-valuation-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-actions.txt
      - name: Fetch latest FactSet forward valuation
        run: python scripts/fetch_spy_valuation.py
      - name: Validate valuation data
        run: python scripts/validate_data.py --valuation
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spy_valuation.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update SPY forward valuation $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
